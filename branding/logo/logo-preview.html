<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Tiro — Logo Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF7F1;--linen:#F1E9DC;--ink:#2A2521;--stone:#7A6E64;--clay:#C8683E;--line:rgba(42,37,33,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2A2521;font-family:ui-sans-serif,system-ui,sans-serif}
  .board{width:1280px;margin:0 auto;background:var(--paper);color:var(--ink);padding:72px 80px}
  .crumb{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--stone)}
  .title{font-family:'Young Serif',serif;font-size:40px;margin:8px 0 48px}
  .title .dot{color:var(--clay)}
  .lab{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);margin-bottom:18px;display:flex;align-items:center;gap:12px}
  .lab::after{content:"";height:1px;flex:1;background:var(--line)}
  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin-bottom:40px}
  .card{border:1px solid var(--line);border-radius:16px;padding:40px;display:flex;align-items:center;justify-content:center;min-height:240px}
  .card.dark{background:var(--ink);border-color:transparent}
  .card.clay{background:var(--clay);border-color:transparent}
  .card.linen{background:var(--linen)}
  /* lockup */
  .lockup{display:flex;align-items:center;gap:22px}
  .lockup img{width:96px;height:96px}
  .lockup .wm{font-family:'Young Serif',serif;font-size:76px;line-height:1;color:var(--ink)}
  .lockup .wm .dot{color:var(--clay)}
  .lockup.stack{flex-direction:column;gap:14px}
  .lockup.stack img{width:120px;height:120px}
  /* size ladder */
  .ladder{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:40px;background:#fff}
  .size{display:flex;flex-direction:column;align-items:center;gap:14px}
  .size .px{font-size:12px;color:var(--stone);letter-spacing:.04em}
  .size .chip{background:var(--paper);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center}
  .foot{display:flex;justify-content:space-between;margin-top:48px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.06em;color:var(--stone)}
</style>
</head>
<body>
  <div class="board">
    <div class="crumb">Brand Foundations</div>
    <div class="title">Tiro<span class="dot">.</span> — Logo</div>

    <div class="lab">Primary lockup &amp; mark</div>
    <div class="grid">
      <div class="card linen">
        <div class="lockup">
          <img src="tiro-mark-clay.svg" alt="Tiro mark"/>
          <div class="wm">Tiro<span class="dot">.</span></div>
        </div>
      </div>
      <div class="card">
        <div class="lockup stack">
          <img src="tiro-mark-clay.svg" alt="Tiro mark"/>
          <div class="wm" style="font-size:44px">Tiro<span class="dot">.</span></div>
        </div>
      </div>
    </div>

    <div class="lab">On color</div>
    <div class="grid">
      <div class="card dark"><img src="tiro-mark-white.svg" alt="" style="width:120px;height:120px"/></div>
      <div class="card clay"><img src="tiro-mark-white.svg" alt="" style="width:120px;height:120px"/></div>
    </div>

    <div class="lab">Small-size legibility — favicon &amp; UI</div>
    <div class="ladder">
      <div class="size"><div class="chip" style="width:120px;height:120px"><img src="tiro-mark-ink.svg" style="width:104px;height:104px"></div><div class="px">96 px</div></div>
      <div class="size"><div class="chip" style="width:80px;height:80px"><img src="tiro-mark-ink.svg" style="width:64px;height:64px"></div><div class="px">64 px</div></div>
      <div class="size"><div class="chip" style="width:56px;height:56px"><img src="tiro-mark-ink.svg" style="width:40px;height:40px"></div><div class="px">40 px</div></div>
      <div class="size"><div class="chip" style="width:48px;height:48px"><img src="tiro-mark-ink.svg" style="width:32px;height:32px"></div><div class="px">32 px</div></div>
      <div class="size"><div class="chip" style="width:40px;height:40px"><img src="tiro-mark-ink.svg" style="width:24px;height:24px"></div><div class="px">24 px</div></div>
      <div class="size"><div class="chip" style="width:32px;height:32px"><img src="tiro-mark-ink.svg" style="width:16px;height:16px"></div><div class="px">16 px</div></div>
    </div>

    <div class="foot"><span>TIRO — LOGO PREVIEW</span><span>MARK · LOCKUP · COLOR · SCALE</span></div>
  </div>
</body>
</html>
