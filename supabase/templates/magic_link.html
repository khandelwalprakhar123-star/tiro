<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <!--[if mso]>
    <style type="text/css">
      table { border-collapse: collapse; }
      .serif { font-family: Georgia, 'Times New Roman', serif !important; }
    </style>
    <![endif]-->
  </head>
  <body style="margin:0;padding:0;background-color:#f1e7d3;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1e7d3;">
      <tr>
        <td align="center" style="padding:32px 16px;">

          <!--[if mso]>
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"><tr><td>
          <![endif]-->

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;background-color:#faf4e8;border:1px solid #e0d4bc;border-radius:16px;">

            <!-- Header / wordmark -->
            <tr>
              <td style="padding:32px 40px 0 40px;">
                <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6b6051;font-weight:bold;">
                  <span style="display:inline-block;width:28px;height:2px;background-color:#e89c00;vertical-align:middle;margin-right:8px;line-height:2px;font-size:2px;mso-line-height-rule:exactly;">&nbsp;</span>
                  Tiro
                </p>
              </td>
            </tr>

            <!-- Heading -->
            <tr>
              <td style="padding:24px 40px 0 40px;">
                <h1 class="serif" style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:1.1;color:#211c14;font-weight:bold;">
                  Your sign-in code
                </h1>
                <p style="margin:12px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#6b6051;">
                  Enter this code to open your desk. It expires in 1 hour and can only be used once.
                </p>
              </td>
            </tr>

            <!-- The code — light box, ink text, yolk accent bar -->
            <tr>
              <td style="padding:28px 40px 8px 40px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;border:1px solid #e0d4bc;border-radius:12px;">
                  <tr>
                    <td height="5" style="height:5px;background-color:#ffb300;border-top-left-radius:12px;border-top-right-radius:12px;font-size:5px;line-height:5px;mso-line-height-rule:exactly;">&nbsp;</td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:24px;">
                      <span class="serif" style="font-family:Georgia,'Times New Roman',serif;font-size:42px;letter-spacing:12px;color:#211c14;font-weight:bold;">{{ .Token }}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Reassurance -->
            <tr>
              <td style="padding:16px 40px 36px 40px;">
                <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6b6051;">
                  Didn&rsquo;t request this? You can safely ignore this email &mdash; no one can sign in without the code.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:20px 40px;background-color:#f1e7d3;border-top:1px solid #e0d4bc;border-bottom-left-radius:16px;border-bottom-right-radius:16px;">
                <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#a99d88;">
                  Tiro &middot; Write with everything.
                </p>
              </td>
            </tr>

          </table>

          <!--[if mso]>
          </td></tr></table>
          <![endif]-->

        </td>
      </tr>
    </table>
  </body>
</html>
